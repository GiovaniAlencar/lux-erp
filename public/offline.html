<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>Sem conexão · LUX ERP</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: #0b0b0c; color: #e9e4d8; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .box { text-align: center; max-width: 360px; }
  img { width: 96px; height: 96px; border-radius: 20px; }
  h1 { font-size: 20px; font-weight: 600; margin: 20px 0 8px; color: #d4af37; }
  p { font-size: 14px; line-height: 1.5; color: #a9a294; margin: 0 0 24px; }
  button { background: #d4af37; color: #0b0b0c; border: 0; border-radius: 8px; padding: 10px 22px;
           font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #e2c25a; }
</style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="LUX">
    <h1>Sem conexão</h1>
    <p>Não foi possível falar com o servidor. Verifique a internet e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
